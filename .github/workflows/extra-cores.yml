name: Extra cores

# Cores the libretro web buildbot doesn't ship (currently Nintendo 64),
# built from source against RetroArch master. The result is attached to the
# "extra-cores" prerelease, which the main build picks up.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/extra-cores.yml", "tools/extra-cores/**"]

permissions:
  contents: write

env:
  EMSDK_VERSION: 3.1.46

jobs:
  mupen64plus_next:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Build core
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          git clone --depth 1 https://github.com/libretro/mupen64plus-libretro-nx.git core
          cd core
          # The core's Makefile renames its copy of libretro-common to avoid
          # clashing with RetroArch's, but misses these newer symbols.
          # (Passed via the environment: the Makefile appends with +=.)
          RENAMES="-Dconvert_float_to_s16=glupen_convert_float_to_s16 -Dconvert_s16_to_float=glupen_convert_s16_to_float"
          export CFLAGS="$RENAMES" CXXFLAGS="$RENAMES"
          # STATIC_LINKING archives the objects with "$(AR) rcs"; see the
          # script for why it is replaced.
          # The Makefile builds with -fcommon, which leaves globals such as
          # g_dev as common symbols, and archive lookup never pulls a member
          # in for a common symbol. DYNAFLAGS (unused without a dynarec) comes
          # after -fcommon on the command line, so -fno-common wins.
          emmake make platform=emscripten STATIC_LINKING=1 DYNAFLAGS=-fno-common \
            AR="$GITHUB_WORKSPACE/tools/extra-cores/ar-full-paths.sh" -j"$(nproc)"
          ls -la *_emscripten.*

      - name: Build RetroArch with the core
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          git clone --depth 1 https://github.com/libretro/RetroArch.git ra
          cp core/mupen64plus_next_libretro_emscripten.bc ra/libretro_emscripten.bc
          cd ra
          # With -fno-common, globals that both RetroArch and the core's copy
          # of libretro-common define (e.g. the __rglgen_* GL pointers, which
          # -fcommon used to merge) collide; keep the first (RetroArch's).
          # EMCC_CFLAGS because Makefile.emscripten sets LDFLAGS with :=.
          EMCC_CFLAGS="-Wl,--allow-multiple-definition" \
            emmake make -f Makefile.emscripten LIBRETRO=mupen64plus_next -j"$(nproc)" all
          ls -la mupen64plus_next_libretro.*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ra
          if ! gh release view extra-cores -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create extra-cores -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Extra cores (built from source)" \
              --notes "Cores that the libretro web buildbot does not provide, built by .github/workflows/extra-cores.yml. Not an app release."
          fi
          gh release upload extra-cores -R "$GITHUB_REPOSITORY" --clobber \
            mupen64plus_next_libretro.js mupen64plus_next_libretro.wasm
